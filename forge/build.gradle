plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "starmineradditions.mixins.json"
    }

    runs {
        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}

repositories {
    maven {
        name = "AzureDoom Mods"
        url = "https://maven.azuredoom.com/mods"
    }
    maven { url = "https://maven.resourcefulbees.com/repository/maven-public/" }
    maven { url = "https://thedarkcolour.github.io/KotlinForForge/" } // Kotlin For Forge (VS2 runtime)
    // VS-Gravity (gravity-on-ships API fork) is consumed from JitPack — see the
    // com.github.MemezForBeanz:VS-Gravity dependency below. jitpack.io is already declared
    // in the root repositories block.
    maven {
        url "https://cursemaven.com"
    }
    mavenCentral()
    repositories {
        maven { url = "https://maven.bawnorton.com/releases" }

        // Mirror
        maven { url = "https://maven.enjarai.dev/mirrors" }
        maven { url "https://maven.teamresourceful.com/repository/maven-public/" }
    }

}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// Pin the mixin helper libraries to a single version across every configuration (including
// loom's remapped mod configs). Many mods here bundle their own mixinextras/mixinsquared;
// if two *different* versions reach the mod path, Forge unions the duplicated (multi-release)
// packages and dies with "NoSuchFileException: /META-INF/versions". Same-version duplicates
// are deduped by Forge and are fine, so forcing one version is what keeps mod scanning happy.
configurations.all {
    resolutionStrategy {
        force "io.github.llamalad7:mixinextras-common:0.5.4"
        force "io.github.llamalad7:mixinextras-forge:0.5.4"
        force "com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.4"
        force "com.github.bawnorton.mixinsquared:mixinsquared-forge:0.3.4"
        // One Kotlin version across everything -> one module per kotlin package.
        force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    }
}

// groovy
dependencies {
    forge "net.minecraftforge:forge:$project.forge_version"
    modImplementation "dev.architectury:architectury-forge:$project.architectury_api_version"

    // Mixin helper versions MUST match what VS-Gravity ships (mixinsquared 0.3.4,
    // mixinextras 0.5.4). If they differ, VS-Gravity's remapped copy and our copy both
    // land on the mod path as separate jars, and two multi-release mixinextras jars with
    // the same packages make Forge's SecureJar throw "NoSuchFileException: /META-INF/versions"
    // during mod scanning. We provide them; VS-Gravity's transitives are excluded below.
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.4"))
    implementation(include("com.github.bawnorton.mixinsquared:mixinsquared-forge:0.3.4"))

    compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.4"
    implementation "io.github.llamalad7:mixinextras-forge:0.5.4"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Valkyrien Skies 2 (gravity on ships). The forge jar unpacks core impl/internal/game
    // directly and ships api/util only as Jar-in-Jar, which loom strips when remapping for
    // dev. So api/util must be supplied separately here. We exclude the whole core group
    // from the (mod) forge jar and add api/util as plain runtime LIBRARIES via
    // forgeRuntimeLibrary below — NOT as modImplementation. Routing them through
    // modImplementation makes loom remap them into mod jars that Forge then scans, and the
    // remapped core jars blow up mod discovery with UnionFileSystem "NoSuchFileException:
    // /META-INF/versions". VS-Gravity's own build depends on VS core the same way (plain
    // libraries, joml excluded because Minecraft already provides joml).
    modImplementation("org.valkyrienskies:valkyrienskies-120-forge:$vs2_version") {
        exclude group: "org.valkyrienskies.core"
    }
    // Exclude only the base joml module (Minecraft ships org.joml:joml) but KEEP
    // joml-primitives, which MC does not bundle and VS needs (org.joml.primitives.*).
    // Keep the transitive kotlin-stdlib: it is the single standalone Kotlin runtime that
    // both the VS forge mod and these forgeRuntimeLibrary modules read. (We do NOT use
    // Kotlin For Forge, whose fat -all jar bundles Kotlin into its own module that the
    // split-out util module can't read -> kotlin.jvm.internal.Intrinsics NoClassDefFound.)
    forgeRuntimeLibrary("org.valkyrienskies.core:api:$vscore_version") {
        exclude group: "org.joml", module: "joml"
    }
    forgeRuntimeLibrary("org.valkyrienskies.core:util:$vscore_version") {
        exclude group: "org.joml", module: "joml"
    }
    // Kotlin runtime for VS (kotlin-stdlib arrives transitively via api/util above; VS also
    // uses reflection). A single consistent Kotlin version keeps one module per package.
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    // VS also uses kotlinx coroutines (ship physics) and serialization at runtime; KFF used
    // to bundle these. Versions match what Kotlin For Forge 4.x shipped (kotlin 2.x compatible).
    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.1"
    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.8.1"
    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.6.3"
    // The forge jar JiJs VS core's other runtime libraries (dagger DI, the jackson stack,
    // commons-math3, json-schema, ...) and loom strips that JiJ in dev — so add them here.
    // Coordinates/versions are taken verbatim from the forge jar's META-INF/jarjar/metadata.json.
    [
        "javax.inject:javax.inject:1",
        "com.google.dagger:dagger:2.43.2",
        "org.apache.commons:commons-math3:3.6.1",
        "org.apache.commons:commons-collections4:4.3",
        "com.fasterxml.jackson.core:jackson-core:2.14.0",
        "com.fasterxml.jackson.core:jackson-annotations:2.14.0",
        "com.fasterxml.jackson.core:jackson-databind:2.14.0",
        "com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.14.0",
        "com.fasterxml.jackson.module:jackson-module-parameter-names:2.14.0",
        "com.fasterxml.jackson.module:jackson-module-kotlin:2.14.0-rubyfork",
        "com.github.Rubydesic:jackson-kotlin-dsl:1.2.0",
        "com.networknt:json-schema-validator:1.0.71",
        "com.ethlo.time:itu:1.7.0",
        "com.github.victools:jsonschema-module-jackson:4.25.0",
        "com.github.victools:jsonschema-generator:4.25.0",
        "com.fasterxml:classmate:1.5.1",
        "com.flipkart.zjsonpatch:zjsonpatch:0.4.11",
    ].each { forgeRuntimeLibrary(it) { exclude group: "org.jetbrains.kotlin" } }
    // VS-Gravity ships its own mixinextras/mixinsquared; exclude them so we don't get a
    // second (remapped) copy of those mixin libs on the mod path — the copies above serve both.
    modImplementation("com.github.MemezForBeanz:VS-Gravity:1.0.7") {
        exclude group: "io.github.llamalad7"
        exclude group: "com.github.bawnorton.mixinsquared"
    }

    // AzureLib: Neo works with forge
    modImplementation "mod.azure.azurelib:azurelib-neo-$minecraft_version:$azurelib_version"

    modImplementation "com.teamresourceful.resourcefullib:resourcefullib-forge-1.20.1:2.1.29"

    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
}


processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }

    // Include common resources like mixins.json
    from(project(':common').file('src/main/resources')) {
        include 'starmineradditions.mixins.json'
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // Include forge module's own resources
    from(sourceSets.main.output) {
        include 'META-INF/**'
        include '*.json'
        include 'pack.mcmeta'
    }
}

remapJar {
    input.set shadowJar.archiveFile
}