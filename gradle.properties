cardinal_components_version=VERSIONED

# Valkyrien Skies 2 (gravity-on-ships compat). Versions MUST match what the
# gravity-api (min01) mod is built against, so a single VS2/VS-core is on the
# classpath at runtime. See https://maven.valkyrienskies.org/
vs2_version=2.4.13+eeaa2beb3f
vscore_version=1.1.0+ea6dc8576e
# VS2 is written in Kotlin and needs the Kotlin runtime (kotlin-stdlib/reflect) at runtime.
# kotlin-stdlib arrives transitively via VS core api/util; this pins the version so every
# Kotlin lib resolves to one module. VS core 1.1.0+ea6dc8576e is built against Kotlin 2.1.0.
kotlin_version=2.1.0

