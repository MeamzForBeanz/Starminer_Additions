plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$project.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    include modApi("teamreborn:energy:$energy_version")

    // Valkyrien Skies 2 (gravity-on-ships). Version pinned to match gravity-api.
    modImplementation("org.valkyrienskies:valkyrienskies-120-fabric:$vs2_version")

    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-world:${project.cardinal_components_version}"
    modLocalRuntime "maven.modrinth:modmenu:$modmenu_version"
    modApi("me.shedaniel.cloth:cloth-config-fabric:$clothconfig_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation("com.github.qouteall:GravityChanger:v1.0.2-mc1.20.1")
    implementation("com.eliotlash.mclib:mclib:20")
    modImplementation "mod.azure.azurelib:azurelib-$modLoader-$minecraft_version:$azurelib_version"
}

processResources {
    Map<String, Object> properties = [
            "version": version,
            "fabric_loader_version": fabric_loader_version,
            "fabric_api_version": fabric_api_version,
            "minecraft_version": minecraft_version
    ]
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    // Include common resources like mixins.json
    from(project(':common').file('src/main/resources')) {
        include 'starmineradditions.mixins.json'
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // Include fabric module's own resources
    from(sourceSets.main.output) {
        include '*.json'
    }
}

remapJar {
    input.set shadowJar.archiveFile
}
